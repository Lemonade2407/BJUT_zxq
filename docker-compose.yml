services:
  # MySQL数据库（内部服务，不暴露端口）
  mysql:
    image: mysql:8.0
    container_name: bjut-zxq-mysql
    restart: always
    networks:
      - backend-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bjut_zxq
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（内部服务，不暴露端口）
  redis:
    image: redis:7-alpine
    container_name: bjut-zxq-redis
    restart: always
    networks:
      - backend-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  # Spring Boot后端
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bjut-zxq-backend
    restart: always
    networks:
      - backend-network
      - frontend-network
    # 加载环境变量文件
    env_file:
      - .env
    environment:
      # 数据库配置（从 .env 文件读取）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bjut_zxq}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?error}
      
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # OSS配置（从 .env 文件读取）
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?error}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?error}
      
      # JWT配置（从 .env 文件读取）
      JWT_SECRET: ${JWT_SECRET:?error}
      
      # JVM参数
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
      
      # 时区配置（与阿里云 OSS 北京区域保持一致）
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
      # Maven 本地仓库缓存（加速构建）
      - maven_cache:/root/.m2
      # 挂载主机时区文件（Windows 不支持，使用 TZ 环境变量）
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Vue前端(Nginx)
  frontend:
    build:
      context: ./Vue
      dockerfile: Dockerfile.frontend
    container_name: bjut-zxq-frontend
    restart: always
    networks:
      - frontend-network
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"
      - "443:443"  # HTTPS端口（需要SSL证书时启用）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # SSL证书目录(可选)
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mysql_data:
    driver: local
  maven_cache:
    driver: local
  redis_data:
    driver: local

networks:
  # 前端网络：对外提供服务
  frontend-network:
    driver: bridge
  # 后端网络：内部服务通信
  backend-network:
    driver: bridge
    internal: true  # 内部网络，不允许外部访问
